name: Mobil uygulama (APK)

on:
  push:
    paths:
      - 'mobil/**'
      - '.github/workflows/mobil-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Paketleri indir
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: APK oluştur
        run: flutter build apk --release

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: karbon-ayak-izi-apk
          path: mobil/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
